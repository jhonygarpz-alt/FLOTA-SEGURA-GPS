name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flota
          POSTGRES_PASSWORD: flota
          POSTGRES_DB: flota_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flota" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://flota:flota@localhost:5432/flota_test?schema=public
      TEST_DATABASE_URL: postgresql://flota:flota@localhost:5432/flota_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run build -w apps/api
      - run: npm test -w apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w apps/web
      - run: npm test -w apps/web
      - run: npm run build -w apps/web
